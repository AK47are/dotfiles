# 設輸入方案裏 {name: ascii_mode} 在 switches: 列表中爲第一項，即下標 0
patch:
  switches/@0/reset: 1
  # 语言模型
  grammar/language: wanxiang-lts-zh-hans
  grammar/collocation_max_length: 5
  grammar/collocation_min_length: 2

  # translator 内加载
  translator/contextual_suggestions: true
  translator/max_homophones: 7
  translator/max_homographs: 7

  key_binder/search: "~" # 辅码引导符

  # 去除 ` 换成 ~，和 inline_code 匹配冲突，如果添加则末尾必须多按一次空格
  speller/alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA~

  engine/processors: # 有顺序要求
    - lua_processor@*handle_pattern_space # 当符合特定模式时拦截空格向下传递
    - lua_processor@*select_character # 以词定字
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
