patch:
  schema_list:
    - { schema: double_pinyin }

  switcher/fold_options: false
  ascii_composer/switch_key/Shift_L: nonp

  menu:
    page_size: 7

  recognizer/patterns: # 转换成临时英文模式
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    underscore: "^[A-Za-z]+_.*"
    inline_latex: "^\\$[^\\$]*$"
    inline_code: "^`[^`]*$"

  key_binder/bindings:
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
