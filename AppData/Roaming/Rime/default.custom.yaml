patch:
  schema_list:
    - { schema: double_pinyin }

  switcher/fold_options: false
  ascii_composer/switch_key/Shift_L: nonp

  menu:
    page_size: 7

  recognizer/patterns: # 转换成临时英文模式
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    underscore: "^[A-Za-z]+_.*"
    inline_latex: "^\\$[^\\$]*$"
    inline_code: "^`[^`]*$"

  punctuator/half_shape/+:
    "$": "$"

  key_binder:
    # 和上面 inline_code 冲突，例如打 `[[Prototype]]`
    # 改成小键盘的 -= 和翻页快捷键对应
    select_first_character: "KP_Subtract"
    select_last_character: "KP_Add"
    bindings:
      - { when: has_menu, accept: minus, send: Page_Up }
      - { when: has_menu, accept: equal, send: Page_Down }
