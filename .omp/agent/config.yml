theme: 
  dark: dark-catppuccin
  light: light-catppuccin
symbolPreset: nerd
colorBlindMode: false
statusLine: 
  separator: powerline-thin
display: 
  showTokenUsage: true
  shimmer: classic
clearOnShrink: true
hideThinkingBlock: true
autoResume: false
steeringMode: one-at-a-time
treeFilterMode: default
startup: 
  checkUpdate: false
  quiet: true
collapseChangelog: true
edit: 
  mode: hashline
memory: 
  backend: mnemopi
todo: 
  eager: always
renderMermaid: 
  enabled: true
inspect_image: 
  enabled: true
github: 
  enabled: false
dev: 
  autoqa: false
secrets: 
  enabled: true
disabledProviders: 
  - claude
  - claude-plugins
branchSummary: 
  enabled: true
commands: 
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
skills: 
  enableSkillCommands: true
modelRoles: 
  default: opencode-go/deepseek-v4-flash:xhigh
  smol: opencode-go/deepseek-v4-flash:off
  commit: opencode-go/deepseek-v4-flash:xhigh
  task: opencode-go/deepseek-v4-flash:xhigh
  slow: opencode-go/glm-5.2:xhigh
  plan: opencode-go/deepseek-v4-pro:xhigh
  designer: opencode-go/deepseek-v4-flash
  advisor: opencode-go/deepseek-v4-flash:xhigh
  vision: opencode-go/mimo-v2.5:xhigh
lsp: 
  formatOnWrite: true
  diagnosticsOnEdit: true
read: 
  toolResultPreview: false
  summarize: 
    enabled: true
compaction: 
  handoffSaveToDisk: true
python: 
  kernelMode: session
task: 
  isolation: 
    mode: auto
contextPromotion: 
  enabled: false
defaultThinkingLevel: auto
mnemopi: 
  scoping: per-project-tagged
  autoRecall: true
ttsr: 
  repeatMode: once
  contextMode: discard
setupVersion: 1
astGrep: 
  enabled: true
checkpoint: 
  enabled: true
advisor: 
  enabled: true
  subagents: true
  syncBacklog: "off"
features: 
  unexpectedStopDetection: true
retry: 
  modelFallback: true
  fallbackChains: 
    opencode-go/deepseek-v4-flash: 
      - nvidia/deepseek-ai/deepseek-v4-flash
      - deepseek/deepseek-v4-flash
    opencode-go/deepseek-v4-pro: 
      - nvidia/deepseek-ai/deepseek-v4-pro
      - deepseek/deepseek-v4-pro